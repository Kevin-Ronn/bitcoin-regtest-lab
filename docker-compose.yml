services:
  bitcoin1:
    image: ruimarinho/bitcoin-core:latest
    container_name: btc-regtest-node1
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001
      - -rpcuser=lab
      - -rpcpassword=labpassword
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -listen=1
      - -port=18444
    volumes:
      - ./bitcoin1:/home/bitcoin/.bitcoin
    networks:
      - bitcoinlab

  bitcoin2:
    image: ruimarinho/bitcoin-core:latest
    container_name: btc-regtest-node2
    command:
      - -regtest=1
      - -server=1
      - -txindex=1
      - -fallbackfee=0.0001
      - -rpcuser=lab
      - -rpcpassword=labpassword
      - -rpcbind=0.0.0.0
      - -rpcallowip=0.0.0.0/0
      - -listen=1
      - -port=18444
    volumes:
      - ./bitcoin2:/home/bitcoin/.bitcoin
    networks:
      - bitcoinlab

networks:
  bitcoinlab:
    driver: bridge
